# Builds Coursmith Setup for Windows, macOS and Linux and attaches the installers to a draft GitHub release.
# Runs on a version tag (v0.1.0) or by hand. The installers are not code-signed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            # One app for both Apple Silicon and Intel Macs.
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Tauri test binaries cannot start on Windows runners (STATUS_ENTRYPOINT_NOT_FOUND: no comctl32 v6 manifest),
      # so the unit tests run on Linux and macOS; the Windows app itself is still built below.
      - name: Unit tests
        if: runner.os != 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Coursmith Setup v__VERSION__"
          releaseBody: "Installers for Windows (.exe, .msi), macOS (.dmg, universal) and Linux (.AppImage, .deb, .rpm). They are not code-signed: see the README for how to open them. The coursmith-setup-* files are the same installers under fixed names. Publish this draft to make it the latest release."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Copies of the installers under fixed names, so the stable link
  # https://github.com/Uranio/coursmith-installer/releases/latest/download/<name> always serves the newest version
  # (the Coursmith install page links to these).
  stable-names:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - name: Upload copies with fixed names
        run: |
          tag="${TAG:-v$(gh api repos/${{ github.repository }}/releases --jq '.[0].tag_name' | sed 's/^v//')}"
          mkdir dl && cd dl
          gh release download "$tag" -R ${{ github.repository }} -p "*-setup.exe" -p "*.dmg" -p "*.AppImage" -p "*.deb" -p "*.rpm"
          cp ./*-setup.exe coursmith-setup-windows.exe
          cp ./*.dmg coursmith-setup-macos.dmg
          cp ./*.AppImage coursmith-setup-linux.AppImage
          cp ./*.deb coursmith-setup-linux.deb
          cp ./*.rpm coursmith-setup-linux.rpm
          gh release upload "$tag" -R ${{ github.repository }} --clobber \
            coursmith-setup-windows.exe coursmith-setup-macos.dmg coursmith-setup-linux.AppImage \
            coursmith-setup-linux.deb coursmith-setup-linux.rpm
