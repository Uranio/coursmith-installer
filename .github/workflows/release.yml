# Builds Coursmith Setup for Windows, macOS and Linux and attaches the installers to a draft GitHub release.
# Runs on a version tag (v0.1.0) or by hand. The installers are not code-signed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            # One app for both Apple Silicon and Intel Macs.
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Coursmith Setup v__VERSION__"
          releaseBody: "Installers for Windows (.exe, .msi), macOS (.dmg, universal) and Linux (.AppImage, .deb, .rpm). They are not code-signed: see the README for how to open them."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
