[package]
name = "coursmith-setup"
version = "0.1.0"
description = "Installs an AI agent, the Coursmith skill and connects your Coursmith account"
edition = "2021"

[lib]
name = "coursmith_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
